summary: >-
  Fifth Desktop + Studio + Gaming Preview ISO. Product 3ef23ca
  (hornero#334) ships the PipeWire audio stack (pipewire, pipewire-audio,
  pipewire-alsa, pipewire-pulse, wireplumber) in the base Desktop set,
  so Desktop and Gaming installs now have a working WirePlumber session
  manager; installer de7fa9a (installer#46 pin, #45 Gaming description)
  renders the six base choices. A clean Studio (Hyprland, UEFI,
  unencrypted) install from this ISO passed in a disposable VM:
  `horneroctl studio doctor` 5/5, PipeWire and WirePlumber active, and
  an OBS 32.2.2 test recording finalized a playable H.264/AAC file
  ("File output complete", ffprobe-verified). Known limitations found
  on real hardware after this build (fixed in later installer releases,
  not in this ISO): installed targets ship a stock Arch mirrorlist with
  no enabled server plus a missing [multilib] include, so `pacman -Syu`
  fails until corrected once by hand (installer#47); a `pacman -Syu`
  that upgrades Hyprland 0.56 to 0.57 makes Hyprland regenerate an
  autogenerated `hyprland.lua` that shadows the hornero-config 0.3.11
  configuration (AUR hornero-config 0.3.13 is Lua-based). Gaming,
  Studio and Desktop remain Preview; no physical-hardware, NVENC,
  camera or streaming qualification is claimed.
