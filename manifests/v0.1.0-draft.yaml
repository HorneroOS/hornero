# Hornero OS composition manifest: hornero-0.1.0-draft
#
# Live pin surface: shell/config SHAs track their mains and are refreshed
# by the release process (docs/RELEASE_PROCESS.md) whenever check-pins
# reports drift. History is preserved by git tags (v0.1.0-draft, ...),
# never by stale pins in this file.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.1.0-draft
date: "2026-09-15"
description: >-
  Composition manifest. Pins HorneroOS/shell and HorneroOS/config
  to their current main SHAs. horneroctl builds from this repository.
  installer and iso are named future slots only. Refreshed 2026-09-15
  (governance + AUR packaging pins).

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: 4317bddcff59b367a87bc2984363a33ef7bf8103
    status: pinned
    subject: "Merge pull request #29 from HorneroOS/style/bare-on-trigger"
    notes: Desktop shell / Quickshell UX.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: 923bdbc932036145f37ccea981d9cbc62f0f4077
    status: pinned
    subject: "Merge pull request #29 from HorneroOS/style/bare-on-trigger"
    notes: Reusable desktop and system defaults.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: System CLI built from this repository at release time, not pinned.
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. Install and first-boot flows are defined by HorneroOS/installer in a follow-up.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot. Image build order is documented in docs/RELEASE_PROCESS.md; no image exists yet.
