# Hornero OS composition manifest: hornero-0.2.0-preview22
#
# Unpublished release candidate. This manifest is not a release until the
# gates in releases/v0.2.0-preview22-checklist.md pass and a maintainer
# approves tagging/publication. Historical manifests are never edited.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview22
date: "2026-10-26"
description: >-
  Second Desktop + Studio Preview ISO release candidate. Same product
  composition as preview21 (product bcc53ed, signed horneroctl-bin
  0.2.0_preview33-1) with installer main c8fbc35: the cancel-during-
  install mount leak (installer#31) is fixed by the recursive-unmount
  fallback (#32) and the signed preview33 lock lost in the #30 refresh
  is restored (#33). Rebuilt only in a disposable VM; guest+host
  SHA-256 verified (38ec76d7c9c10ea3e956b2c9f2d8d420e3d09b61899dc453a2858622d7e90bd2)
  and the ISO carries a detached signature from the HorneroOS releases
  key. Cancel retest executed end-to-end on this ISO: cancelling at
  "Install packages." 64% leaves no calamares-root mount and a usable
  live session (PASS). Install matrix evidence from preview21 carries
  over per the delta justification (only the installer cleanup and
  lock restoration changed). Studio remains maturity-planned:
  hornero-qa studio-gate still reports BLOCKED pending hardware
  fixture acceptance, so no Studio Preview promotion is claimed.

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: 5e14df7c0a90e1f4a84a270c946813dcd27d68e7
    status: pinned
    subject: "Merge pull request #331 from HorneroOS/feat/shell-ux-pass-2"
    notes: Desktop shell / Quickshell UX as pinned by the ISO AUR recipe hornero-shell 1.2.56-1.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: 75c196f58b5c4237461c9885b4cb7ed7c5c61ac9
    status: pinned
    subject: "feat(hypr): migrate Hyprland config and helpers to Lua-only (#107)"
    notes: Lua-only Hyprland configuration; helpers integrated as hyprland.lua.d modules.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: System CLI built from this repository at release time, not pinned. The ISO ships the signed AUR horneroctl-bin 0.2.0_preview33-1 (tag horneroctl-v0.2.0-preview33, product revision bcc53ede593d54f6b9e7562a50cf6c620e56b275).
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. The provisional Calamares candidate (installer revision c8fbc359843c2249945adf0091d732c628330d8f, Calamares 3.4.3, Arch snapshot 2026/10/10) produced the RC ISO below; it is not yet a pinned component of this composition.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: "Reserved slot. RC artifact: horneroos-2026.10-preview22-x86_64.iso sha256 38ec76d7c9c10ea3e956b2c9f2d8d420e3d09b61899dc453a2858622d7e90bd2, built in a disposable VM; guest+host checksum verified, tampered copies fail checksum and signature verification. Detached signature: HorneroOS releases key FCFBEE43925AB5429362278AE59EAB44AA2498DC."
