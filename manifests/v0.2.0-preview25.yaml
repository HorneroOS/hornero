# Hornero OS composition manifest: hornero-0.2.0-preview25
#
# Published pre-release. Historical manifests are never edited.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview25
date: "2026-10-29"
description: >-
  Fifth Desktop + Studio + Gaming Preview ISO. Product composition is
  hornero 3ef23cab7455665bd2148d0dcbd42b4231371ad5 (hornero#334 adds
  the PipeWire audio stack to the base desktop set) with the signed AUR
  horneroctl-bin 0.2.0_preview36-1; installer
  de7fa9a612146494576d9fd955ce36a6f185b942 (installer#46 pin, #45
  Gaming description fix) renders Desktop, Studio and Gaming base
  choices (Hyprland plus experimental Niri) from that catalogue. Built
  only in the disposable build VM; guest and host SHA-256 match and the
  detached signature verifies (see the release checklist). A clean
  Studio (Hyprland) install passed in a disposable QEMU/UEFI VM with
  `horneroctl studio doctor` 5/5 and an OBS recording that finalized a
  playable file. All editions remain Preview, not supported. Known
  limitations: the installed target ships a stock Arch mirrorlist with
  no enabled server and a missing [multilib] include, so system updates
  fail until corrected once by hand (fix in HorneroOS/installer#47 for
  the next ISO); updating Hyprland 0.56 to 0.57 regenerates an
  autogenerated hyprland.lua that shadows hornero-config 0.3.11. The
  2.6 GB ISO exceeds GitHub's 2 GB asset limit and is distributed via
  Vercel Blob with checksum and signature verification.

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: ca8f5ca735ffbb8581537ac5b5f1a1d74082fcb0
    status: pinned
    subject: "shell pin shipped in the preview25 ISO lock (hornero-shell 1.2.56-1)"
    notes: As recorded in the ISO manifest. The Control Center Gaming pane Preview copy (shell#338) ships with the next hornero-shell package release, not in this ISO.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: 811ecd73fd201de30cf333af53ccfa7cdb966740
    status: pinned
    subject: "config pin shipped in the preview25 ISO lock (hornero-config 0.3.11-1)"
    notes: The ISO installs hornero-config 0.3.11-1 (conf-based Hyprland). AUR hornero-config 0.3.13 (this commit) is the Lua-based successor; see the upgrade guide before updating Hyprland past 0.56.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: System CLI built from this repository at release time, not pinned. The ISO ships the signed AUR horneroctl-bin 0.2.0_preview36-1 (tag horneroctl-v0.2.0-preview36, product revision 8436a8a97961d9f65a2e866e0584f4e4755741e1).
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. The provisional Calamares installer (installer revision de7fa9a612146494576d9fd955ce36a6f185b942, Calamares 3.4.3, Arch snapshot 2026/10/10) produced the ISO below; it is not yet a pinned component of this composition.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: "Reserved slot. Artifact: horneroos-2026.10-preview25-x86_64.iso; SHA-256 5680994a0cebb945b8ef9c7da5ed18f535ddb96b60e58d9592b45ee0c9347376 and signature recorded in releases/v0.2.0-preview25-checklist.md, built in a disposable VM with guest+host checksum verification. Detached signature: HorneroOS releases key FCFBEE43925AB5429362278AE59EAB44AA2498DC."
