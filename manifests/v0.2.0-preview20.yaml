# Hornero OS composition manifest: hornero-0.2.0-preview20
#
# Unpublished composition candidate. This manifest is not a release until
# its pinned composition passes the exact-pins VM and Hornero QA gates.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview20
date: "2026-10-19"
description: >-
  Unpublished composition candidate adding the Hermes Companion
  backend: horneroctl assistant with the verified approval protocol,
  the Hornero Hermes skill, and the native Companion chat panel.
  Community packages remain
  inert data; validation does not activate or sandbox QML. No VM or exact-pin QA
  acceptance has been recorded for this composition. Installer and ISO are
  future slots and no installable image is claimed.

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: 514860b51bc606e78059f71447e2fa504d1c1ddd
    status: pinned
    subject: "feat(controlcenter): Input layout list/set editor (shell#226)"
    notes: Desktop shell / Quickshell UX, static plugin contract validator, reliable terminal selection, and accessible Control Center navigation.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: 297bf9b8958f4cadf3069b367b9431a8890be80a
    status: pinned
    subject: "feat(hypr): restore persisted input + keyboard layout at login"
    notes: Reusable desktop and system defaults, including the canonical terminal integration catalogue.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: System CLI built from this repository at release time, not pinned.
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot; no installer integration is part of this composition.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot; no installable image is produced by this composition.
