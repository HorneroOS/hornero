# Hornero OS composition manifest: hornero-0.2.0-preview8
#
# Release-candidate composition for Development Preview 8. This file is
# IMMUTABLE once the v0.2.0-preview8 tag is cut: a new release always
# gets a new manifest file, historical manifests are never rewritten.
# Before freezing, the shell/config pins below are refreshed to their
# current mains (docs/RELEASE_PROCESS.md); freshness is enforced only
# for the candidate named in manifests/candidate
# (scripts/check-pins.py).

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview8
date: "2026-09-29"
description: >-
  Release-candidate composition for Development Preview 8. Picks up
  everything in Preview 7 plus the docs-coherence README updates in
  both components (shell status, 15 theme packs). Pins HorneroOS/shell
  and HorneroOS/config to their release-candidate main SHAs.
  horneroctl builds from this repository. installer and iso are
  named future slots only.

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: 2675f03acaae9c697c77111f3e2951244ad1d222
    status: pinned
    subject: "docs(readme): reconcile status with current shell reality"
    notes: Desktop shell / Quickshell UX.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: c4a25f0ef2196a9257582190447de9ebc6fd7528
    status: pinned
    subject: "docs(readme): 15 theme packs, drop first-extraction language"
    notes: Reusable desktop and system defaults.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: System CLI built from this repository at release time, not pinned.
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. Install and first-boot flows are defined by HorneroOS/installer in a follow-up.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot. Image build order is documented in docs/RELEASE_PROCESS.md; no image exists yet.
