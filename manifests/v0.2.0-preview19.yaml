# Hornero OS composition manifest: hornero-0.2.0-preview19
#
# Unpublished composition candidate. This manifest is not a release until
# its pinned composition passes the exact-pins VM and Hornero QA gates.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview19
date: "2026-10-12"
description: >-
  Unpublished composition candidate tracking the Shell-owned community plugin
  validator and receipt-owned Hornero CLI package manager. Community packages
  remain inert data; validation does not activate or sandbox QML. No VM or
  exact-pin QA acceptance has been recorded for this composition. Installer
  and ISO are future slots and no installable image is claimed.

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: 6abfa29e5ca52c30fbbe6272cb52de086f8259d8
    status: pinned
    subject: "fix(bar): guard tray menus during model updates"
    notes: Desktop shell / Quickshell UX and the packaged static plugin contract validator.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: 4ef767d13ca1474031c1ac7c034c4639ea9dadb8
    status: pinned
    subject: "fix(config): keep dynamic terminal cursors readable (#73)"
    notes: Reusable desktop and system defaults.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: System CLI built from this repository at release time, not pinned.
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot; no installer integration is part of this composition.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot; no installable image is produced by this composition.
