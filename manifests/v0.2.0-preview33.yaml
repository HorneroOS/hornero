# Hornero OS composition manifest: hornero-0.2.0-preview33
#
# Package-only Hornero Signal candidate (AUR), no ISO.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview33
date: "2026-11-18"
description: >-
  Hornero Signal package release. Ships the Signal shell (Signal
  Bezel visual language, IBM Plex typography, PluginKit 3, Hornero
  Chromatic colour engine) as hornero-shell 1.3.0, the matching
  Signal catalogue as hornero-config 0.4.0, the Signal greeter as
  hornero-greeter 1.1.0 and signed horneroctl-bin 0.2.0_preview46
  (appearance chromatic verbs, config export/import of look packs,
  Signal-style terminal output). Distributed through the AUR only:
  no Preview 33 ISO is built or signed for this record, so the
  installer and iso slots stay future. All editions remain Preview.

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: 6e1874e65eff0f6cb50b6c7d2243e983f791bfaf
    status: pinned
    subject: "chore(packaging): require Signal-capable hornero-config and horneroctl-bin (#675)"
    notes: Frozen Signal shell main; tagged pkg/hornero-shell-v1.3.0 after the PKGBUILD floor bump lands.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: fb8bd68870aadc3084991938459367fde206c736
    status: pinned
    subject: "chore(shell): resync factory default and presets from shell 6e1874e (#159)"
    notes: Frozen Signal config main after the shell factory-default resync; tagged pkg/hornero-config-v0.4.0.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: System CLI built from this repository at release time, not pinned. Published as the signed AUR horneroctl-bin 0.2.0_preview46-1 (tag horneroctl-v0.2.0-preview46).
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. No installer build for this package-only record; the ISO build, signing and upload are maintainer actions.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot. No ISO ships with this record; preview32 remains the current signed Preview ISO.
