# Hornero OS composition manifest: hornero-0.2.0-preview38
#
# Package-only Hornero Signal candidate (AUR), no ISO.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview38
date: "2026-11-23"
description: >-
  Agent Deck package release. Ships hornero-shell 1.3.6
  (PluginKit 5 dashboard pages and the room contract for
  contributed pages), hornero-config 0.4.8 (unchanged in this
  record) and a new signed horneroctl-bin 0.2.0_preview51 built
  from this composition (agent usage schema v2: subscription
  quota windows and 90-day per-day token buckets). The flagship
  consumer is hornero-ai-usage 4.2.0 (Agent Deck) from the
  plugin catalogue. Distributed through the AUR only:
  no ISO is built or signed for this record, so the
  installer and iso slots stay future. Editions are Supported in the catalogue (hornero#467).

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: d705083a885db653dbc07d61780754db3ef9a3bb
    status: pinned
    subject: "chore(packaging): require horneroctl-bin preview51 for hornero-shell 1.3.6 (#712)"
    notes: Frozen Signal shell main; tagged pkg/hornero-shell-v1.3.6 and v1.3.6 on this SHA.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: 466c2abaa5fbe276175beb744e936613051b63c0
    status: pinned
    subject: "feat(appearance): consume the installer-seeded appearance.json at first login (#179)"
    notes: Frozen Signal config main; tagged pkg/hornero-config-v0.4.8 and v0.4.8 on this SHA.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: >-
      System CLI built from this repository, not pinned. New build for
      this record: signed AUR horneroctl-bin 0.2.0_preview51-1 (tag
      horneroctl-v0.2.0-preview51 on this composition merge), built
      and signed by the release workflow.
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. No installer build for this package-only record; the ISO build, signing and upload are maintainer actions.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot. No ISO ships with this record; preview32 remains the current signed Preview ISO.
