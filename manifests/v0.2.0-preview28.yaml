# Hornero OS composition manifest: hornero-0.2.0-preview28
#
# Published pre-release. Historical manifests are never edited.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview28
date: "2026-10-30"
description: >-
  Sixth Desktop + Studio + Gaming Preview ISO. Product composition is
  hornero c2f2ad77bfe50e929b14d4b9874b0b0a71b95149 (hornero#336 adds
  zsh and nano to the factory desktop set) with the signed AUR
  horneroctl-bin 0.2.0_preview36-1 and hornero-config 0.3.14-1;
  installer d02e877e5fe4890dc73b21d743e2fc41d94057f4 renders Desktop,
  Studio and Gaming base choices (Hyprland plus experimental Niri)
  from that catalogue. Built only in the disposable build VM; guest
  and host SHA-256 match and the detached signature verifies (see the
  release checklist). A clean Studio (Hyprland) install passed in a
  disposable QEMU/UEFI VM with ID=horneroos on the installed target,
  `horneroctl studio doctor` 5/5 and an OBS recording that finalized
  a playable file. All editions remain Preview, not supported. The
  2.8 GB ISO exceeds GitHub's 2 GB asset limit and is distributed via
  Vercel Blob with checksum and signature verification.

