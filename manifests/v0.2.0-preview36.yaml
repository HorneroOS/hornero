# Hornero OS composition manifest: hornero-0.2.0-preview36
#
# Package-only Hornero Signal candidate (AUR), no ISO.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview36
date: "2026-11-20"
description: >-
  Hornero Signal follow-up package release. Ships hornero-shell
  1.3.5 (Control Center Extensions pane), hornero-config 0.4.6
  (owner-curated 57-file wallpaper collection) and hornero-greeter
  1.2.0 (Signal greeter, unchanged in this record since its 1.2.0
  package release). The signed horneroctl-bin is unchanged at
  0.2.0_preview49: no new horneroctl is built for this record and
  that binary reports the preview35 composition. Distributed
  through the AUR only:
  no ISO is built or signed for this record, so the
  installer and iso slots stay future. All editions remain Preview.

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: 5a219353f0649323b29b4547c7923d8a8e373bc5
    status: pinned
    subject: "docs: replace concept hero with real Dashboard capture (#706)"
    notes: Frozen Signal shell main; tagged pkg/hornero-shell-v1.3.5 and v1.3.5 on this SHA.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: 2311ab1b2cdac9ade4c563510f0934c4c879ac0e
    status: pinned
    subject: "feat(wallpapers): ship owner-curated 57-file collection (#177)"
    notes: Frozen Signal config main; tagged pkg/hornero-config-v0.4.6 and v0.4.6 on this SHA.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: System CLI built from this repository, not pinned. No new build for this record; the published signed AUR horneroctl-bin remains 0.2.0_preview49-1 (tag horneroctl-v0.2.0-preview49), which reports the preview35 composition.
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. No installer build for this package-only record; the ISO build, signing and upload are maintainer actions.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot. No ISO ships with this record; preview32 remains the current signed Preview ISO.
