# Hornero OS composition manifest: hornero-0.2.0-preview34
#
# Package-only Hornero Signal candidate (AUR), no ISO.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview34
date: "2026-11-18"
description: >-
  Hornero Signal follow-up package release. Ships hornero-shell
  1.3.1 (Javi Workbench v2, approval presence nonce, notification
  physics, fillets, slider readout), hornero-config 0.4.1 (factory
  default resynced with the new shell keys) and signed
  horneroctl-bin 0.2.0_preview47 (assistant backend hardening
  K1-K6: user presence required to approve, on by default; binds
  manifest refresh). The greeter is unchanged (1.1.0-1). The shell
  requires the preview47 CLI so the approve path and the presence
  default arrive together. Distributed through the AUR only:
  no Preview 33 ISO is built or signed for this record, so the
  installer and iso slots stay future. All editions remain Preview.

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: 5a8ae86de679ba0302a0cd83b30df8596e3d50b7
    status: pinned
    subject: "chore(packaging): require hornero-config 0.4.1 and horneroctl-bin 0.2.0_preview47 (#691)"
    notes: Frozen Signal shell main; tagged pkg/hornero-shell-v1.3.1 after the PKGBUILD floor bump lands.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: dd68e89d2879ba1af72f7fa442204c5da3a5bd60
    status: pinned
    subject: "chore(shell): resync factory default and presets from shell 5a8ae86 (#162)"
    notes: Frozen Signal config main after the shell factory-default resync; tagged pkg/hornero-config-v0.4.1.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: System CLI built from this repository at release time, not pinned. Published as the signed AUR horneroctl-bin 0.2.0_preview47-1 (tag horneroctl-v0.2.0-preview47).
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. No installer build for this package-only record; the ISO build, signing and upload are maintainer actions.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot. No ISO ships with this record; preview32 remains the current signed Preview ISO.
