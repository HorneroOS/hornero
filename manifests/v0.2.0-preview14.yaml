# Hornero OS composition manifest: hornero-0.2.0-preview14
#
# Release-candidate composition for Development Preview 14. This file is
# IMMUTABLE once the v0.2.0-preview14 tag is cut: a new release always
# gets a new manifest file, historical manifests are never rewritten.
# Before freezing, the shell/config pins below are refreshed to their
# current mains (docs/RELEASE_PROCESS.md); freshness is enforced only
# for the candidate named in manifests/candidate
# (scripts/check-pins.py).

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview14
date: "2026-10-02"
description: >-
  Release-candidate composition for Development Preview 14. Picks up
  everything in Preview 13 plus the packaging-truth fixes found by Hornero
  QA: package installs ship the layout-preset catalogue where horneroctl
  reads it, hornero-config declares python-materialyoucolor so theme
  switching works, and optional Hyprland plugin config never raises the
  config-error banner. Pins HorneroOS/shell and HorneroOS/config to their
  release-candidate main SHAs. horneroctl builds from this repository.
  installer and iso are named future slots only.

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: b22d33319368263db39b09cdceecd42f04521b61
    status: pinned
    subject: "Merge pull request #95 from HorneroOS/fix/system-preset-catalogue"
    notes: Desktop shell / Quickshell UX.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: f5f7229d4322d2ac6d0a53b601d292e3849f3e49
    status: pinned
    subject: "Merge pull request #45 from HorneroOS/fix/optional-plugin-binds"
    notes: Reusable desktop and system defaults.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: System CLI built from this repository at release time, not pinned.
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. Install and first-boot flows are defined by HorneroOS/installer in a follow-up.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot. Image build order is documented in docs/RELEASE_PROCESS.md; no image exists yet.
