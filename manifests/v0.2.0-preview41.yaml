# Hornero OS composition manifest: hornero-0.2.0-preview41
#
# Package-only Hornero Signal candidate (AUR), no ISO.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview41
date: "2026-11-25"
description: >-
  Product-readiness package release. Ships hornero-shell 1.3.9
  (qt6-multimedia and full PipeWire session stack dependencies so
  package adopters get a working shell and audio; companion fixes:
  generic one-shots complete, add-ons admissible end to end,
  instances placed via slot.targetScreen, generics decoupled from
  Javi's master switch, personality/accessory controls),
  hornero-config 0.4.10 (missing-only user seed backend for
  Install-on-Arch) and horneroctl at this commit (packaged seed
  resolver for config materialize, #480; signed horneroctl-bin
  remains 0.2.0_preview52 until the next signed horneroctl tag).
  The greetd greeter hornero-greeter-greetd 0.1.1 also shipped in
  this window (greeter repo). Distributed through the AUR only:
  no ISO is built or signed for this record. The full graphical
  journey (greetd login, adopted Arch desktop, Studio apps,
  companions, upgrade and config rollback) was validated in a
  clean Arch VM — see HorneroOS/qa#98.

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: 1c0e7e02a627804603ce6392f6fe2fca31271011
    status: pinned
    subject: "fix(packaging): depend on the full PipeWire session stack (#726)"
    notes: Frozen Signal shell main; tagged pkg/hornero-shell-v1.3.9 and v1.3.9 on this SHA.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: 59dfd26e2e65eeac66b53fcfc299df034e3a6c8b
    status: pinned
    subject: "feat(packaging): ship missing-only user seed backend for install-on-Arch (#181)"
    notes: Frozen Signal config main; tagged pkg/hornero-config-v0.4.10 and v0.4.10 on this SHA.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: >-
      Signed AUR horneroctl-bin remains 0.2.0_preview52-1. This
      commit carries the packaged seed resolver (#480); a signed
      horneroctl-bin including it ships with the next horneroctl tag.
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. No installer build for this package-only record.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot. No ISO ships with this record; preview32 remains the current signed Preview ISO.
