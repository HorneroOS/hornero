# Hornero OS composition manifest: hornero-0.2.0-preview39
#
# Package-only Hornero Signal candidate (AUR), no ISO.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview39
date: "2026-11-24"
description: >-
  Companion Platform package release. Ships hornero-shell 1.3.7
  (PluginKit 6 data-only companions, definitive Javi art and
  Nest, sprite import tool, companion add-ons), hornero-config
  0.4.8 (unchanged) and the existing signed horneroctl-bin
