    subject: "feat(appearance): consume the installer-seeded appearance.json at first login (#179)"
    notes: Frozen Signal config main (unchanged from preview38).
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: >-
      Unchanged in this record: signed AUR horneroctl-bin
      0.2.0_preview51-1 from preview38 remains the published CLI.
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. No installer build for this package-only record.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot. No ISO ships with this record; preview32 remains the current signed Preview ISO.
