    ref: main
    sha: b3a98d820e281c49ca38525986c2cef6213b152a
    status: pinned
    subject: "feat(companions): add-on contributions for skins and habitats (#718)"
    notes: Frozen Signal shell main; tagged pkg/hornero-shell-v1.3.7 and v1.3.7 on this SHA.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: 466c2abaa5fbe276175beb744e936613051b63c0
