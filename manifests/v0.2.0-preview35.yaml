# Hornero OS composition manifest: hornero-0.2.0-preview35
#
# Package-only Hornero Signal candidate (AUR), no ISO.

apiVersion: hornero.os/v1
kind: CompositionManifest
name: hornero-0.2.0-preview35
date: "2026-11-18"
description: >-
  Hornero Signal follow-up package release. Ships hornero-shell
  1.3.2 (Argentine Spanish UI with live language switch, opt-in lock
  diagonal hairline, Signal reload-cover slate), hornero-config
  0.4.2 (Qt consumer: qt5ct module and QT_QPA_PLATFORMTHEME
  qt6ct:qt5ct; factory default resynced with general.language and
  lock.diagonalRule) and signed horneroctl-bin 0.2.0_preview48
  (appearance sync-qt / set-qt and Qt doctor checks, so Qt apps
  follow the live palette). The greeter is unchanged (1.1.0-1).
  Distributed through the AUR only:
  no ISO is built or signed for this record, so the
  installer and iso slots stay future. All editions remain Preview.

components:
  shell:
    repo: https://github.com/HorneroOS/shell
    ref: main
    sha: f300a919c5a042c4c02fdb7fcd861f24895a88a5
    status: pinned
    subject: "chore(packaging): require hornero-config 0.4.2 for hornero-shell 1.3.2 (#697)"
    notes: Frozen Signal shell main; tagged pkg/hornero-shell-v1.3.2 after the PKGBUILD floor bump lands.
  config:
    repo: https://github.com/HorneroOS/config
    ref: main
    sha: 5419e40c0d30598328155f41fdf7845d2d6e6351
    status: pinned
    subject: "chore(shell): resync factory default and presets from shell f300a91 (#166)"
    notes: Frozen Signal config main after the shell factory-default resync; tagged pkg/hornero-config-v0.4.2.
  horneroctl:
    repo: https://github.com/HorneroOS/hornero
    path: cli/
    status: local
    notes: System CLI built from this repository at release time, not pinned. Published as the signed AUR horneroctl-bin 0.2.0_preview48-1 (tag horneroctl-v0.2.0-preview48).
  installer:
    repo: https://github.com/HorneroOS/installer
    status: future
    notes: Reserved slot. No installer build for this package-only record; the ISO build, signing and upload are maintainer actions.
  iso:
    repo: https://github.com/HorneroOS/hornero
    path: releases/
    status: future
    notes: Reserved slot. No ISO ships with this record; preview32 remains the current signed Preview ISO.
