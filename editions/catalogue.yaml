    source: arch-extra
    sourceUrl: https://archlinux.org/packages/extra/x86_64/bluez/
    licenses: [GPL-2.0-or-later]
    licenseClass: open-source
    installMethod: pacman-repository
    optional: false
    support: preview
  bluez-utils:
