editions:
  desktop:
    title: HorneroOS Desktop
    maturity: preview
    role: desktop
    packageSets: [desktop]
    compositor:
      default: hyprland
      supported: [hyprland, niri]
  server:
    title: HorneroOS Server
    maturity: planned
    role: server
    packageSets: [server]
  agents:
    title: HorneroOS Agents
    maturity: planned
    role: agent-host
    extends: server
    packageSets: [agents]
    workloadModel:
      runtime: podman-rootless
      serviceManager: systemd-user-quadlet
      firstWorkload: hermes-agent
      hostDockerSocket: forbidden
      secretsInImage: forbidden
  studio:
    title: HorneroOS Studio
    maturity: preview
    role: creative-workstation
    extends: desktop
    packageSets: [studio]
    compositor:
      inherit: desktop
    optionalIntegrations:
      - id: reaper
        source: arch-extra
        licensing: proprietary-user-license
      - id: yabridge
        source: arch-extra
        licensing: user-supplied-windows-vst
  gaming:
    title: HorneroOS Gaming
    maturity: preview
    role: gaming-workstation
    extends: desktop
    packageSets: [gaming]
    compositor:
      inherit: desktop
desktopProvenance:
