# User-selectable Studio applications. Inclusion is a reviewed catalogue
# entry, not an installability or support claim. `packages` are resolved
# through studioProvenance; an entry with no packages is reference-only and
# can never be selected for installation.
studioApplications:
  ardour: {title: Ardour, packages: [ardour]}
  guitarix: {title: Guitarix, packages: [guitarix]}
  carla: {title: Carla, packages: [carla]}
  audacity: {title: Audacity, packages: [audacity]}
  reaper: {title: REAPER, packages: [reaper]}
  yabridge: {title: yabridge (Windows VST bridge), packages: [yabridge, yabridgectl]}
  obs-studio: {title: OBS Studio, packages: [obs-studio, ffmpeg]}
  kdenlive: {title: Kdenlive, packages: [kdenlive, ffmpeg]}
  blender: {title: Blender, packages: [blender]}
  krita: {title: Krita, packages: [krita]}
  gimp: {title: GIMP, packages: [gimp]}
  inkscape: {title: Inkscape, packages: [inkscape]}
  darktable: {title: darktable, packages: [darktable]}
  rawtherapee: {title: RawTherapee, packages: [rawtherapee]}
  graphite: {title: Graphite, packages: [graphite], experimental: true}
  penpot: {title: Penpot, packages: [], availability: reference-only, notes: "Browser-based design tool; use the hosted service or a self-hosted instance. No Arch package is installed."}
  scribus: {title: Scribus, packages: [scribus]}
  freecad: {title: FreeCAD, packages: [freecad]}
  godot: {title: Godot, packages: [godot]}
# Shared creative platform every Studio selection builds on (pro audio stack
# and session management). Application packages are added per selection.
studioPlatformPackages: [pipewire, pipewire-audio, pipewire-alsa, pipewire-pulse, pipewire-jack, wireplumber, qpwgraph]
# Ten user-selectable specializations. Proprietary applications listed in a
# specialization are never installed by group selection alone; they require
# an explicit application-level opt-in. `complete-creative-workstation` must
# stay the union of the other curated groups and `custom-selection` stays
# empty so users can pick applications without a mandatory group.
studioSpecializations:
  audio-music-production:
    title: Audio & Music Production
    applications: [ardour, guitarix, carla, audacity, reaper, yabridge]
  video-editing-post-production:
    title: Video Editing & Post-Production
    applications: [kdenlive, blender]
  streaming-content-creation:
    title: Streaming & Content Creation
    applications: [obs-studio]
