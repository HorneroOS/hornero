apiVersion: hornero.os/v1
kind: EditionCatalogue
version: 1
description: >-
  User-facing editions compose one HorneroOS base, role package sets, and an
  optional Wayland compositor backend. Maturity describes tested product
  behavior, not package availability.
base:
  packages:
    - base
    - linux
    - linux-firmware
    - sudo
    - btrfs-progs
    - cryptsetup
    - dosfstools
    - efibootmgr
    - e2fsprogs
    - grub
    - lvm2
packageSets:
  desktop:
    packages:
      - hornero-shell
      - hornero-config
      - horneroctl-bin
      - pacman-contrib
      - fakeroot
      - quickshell
      - exo
      - kitty
      - thunar
      - networkmanager
      - xdg-desktop-portal
      - qt6ct
      - papirus-icon-theme
      - ttf-cascadia-code-nerd
      - ttf-material-symbols-variable
      - ttf-rubik-vf
      - sddm
      - hornero-greeter
      - hornero-greeter-media-base
      - zsh
      - nano
      - pipewire
      - pipewire-audio
      - pipewire-alsa
      - pipewire-pulse
      - wireplumber
  compositor:hyprland:
    packages:
      - hyprland
      - xdg-desktop-portal-hyprland
  compositor:niri:
    packages:
      - niri
      - xwayland-satellite
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-gnome
  server:
    packages:
      - openssh
      - networkmanager
      - nftables
      - git
      - curl
      - jq
      - ripgrep
      - rsync
      - tmux
      - smartmontools
      - btop
  agents:
    packages:
      - podman
      - crun
      - shadow
    optionalPackages:
      - fuse-overlayfs
      - slirp4netns
  studio:
    packages:
      - pipewire
      - pipewire-audio
      - pipewire-alsa
      - pipewire-pulse
      - pipewire-jack
      - wireplumber
      - qpwgraph
      - ardour
      - guitarix
      - obs-studio
      - kdenlive
      - ffmpeg
      - blender
      - krita
  gaming:
    packages:
      - vulkan-icd-loader
      - lib32-vulkan-icd-loader
      - vulkan-tools
      - xorg-xwayland
      - steam-devices
      - gamemode
      - lib32-gamemode
      - gamescope
      - mangohud
      - lib32-mangohud
compositors:
  hyprland:
    maturity: supported
    packageSet: compositor:hyprland
    capabilities:
      - workspaces
      - windows
      - outputs
      - keyboard-layouts
      - screenshot
      - screencast
  niri:
    maturity: experimental
    packageSet: compositor:niri
    capabilities:
      - workspaces
      - windows
      - outputs
      - keyboard-layouts
      - screenshot
      - screencast
  labwc:
    maturity: planned
    packageSet: null
    capabilities: []
# Installable kernels. Every kernel auto-adds exactly its matching headers
# package in the resolver; headers are never offered without their kernel.
# `linux` stays the only default. Fallback is a second installed kernel the
# bootloader can boot when the primary fails, never a separate concept.
kernels:
  linux:
    packages: [linux]
    headers: linux-headers
    image: vmlinuz-linux
    maturity: supported
    default: true
  linux-lts:
    packages: [linux-lts]
    headers: linux-lts-headers
    image: vmlinuz-linux-lts
    maturity: supported
    default: false
  linux-zen:
    packages: [linux-zen]
    headers: linux-zen-headers
    image: vmlinuz-linux-zen
    maturity: supported
    default: false
  linux-hardened:
    packages: [linux-hardened]
    headers: linux-hardened-headers
    image: vmlinuz-linux-hardened
    maturity: supported
    default: false
# Bootloaders. A bootloader is only offered on firmware it can boot from:
# systemd-boot is UEFI-only, GRUB covers UEFI and legacy BIOS. ESP sizing is
# resolver-computed: espBaseMiB + perKernelMiB per additional kernel.
bootloaders:
  grub:
    packages: [grub, efibootmgr]
    firmwares: [uefi, bios]
    espBaseMiB: 512
    perKernelMiB: 256
    default: true
  systemd-boot:
    packages: []
    firmwares: [uefi]
    requiresUefi: true
    espBaseMiB: 1024
    perKernelMiB: 256
    default: false
# Optional, composable system capabilities. A capability is a catalogue
# entry (packages + systemd services + edition applicability), never a
# package list duplicated in an installer or CLI. `bluetooth` reuses the
# Bluetooth workstream contract: packages bluez/bluez-utils and unit
# bluetooth.service (see horneroctl hardware bluetooth doctor).
capabilities:
  bluetooth:
    title: Bluetooth
    packages: [bluez, bluez-utils]
    services: [bluetooth.service]
    appliesTo: [desktop, studio, gaming]
    defaultByEdition: {desktop: true, server: false, agents: false, studio: true, gaming: true}
    conflicts: []
    requires: []
  printing:
    title: Printing & Scanning
    packages: [cups, system-config-printer, sane, simple-scan]
    services: [cups.service]
    appliesTo: [desktop, studio, gaming]
    defaultByEdition: {desktop: false, server: false, agents: false, studio: false, gaming: false}
    conflicts: []
    requires: []
  openssh:
    title: OpenSSH server
    packages: [openssh]
    services: [sshd.service]
    appliesTo: [desktop, server, agents, studio, gaming]
    defaultByEdition: {desktop: false, server: true, agents: true, studio: false, gaming: false}
    conflicts: []
    requires: []
  # OS snapshots (hornero#179): snapper timeline + snap-pac transaction
  # hooks + grub-btrfs boot entries. Opt-in everywhere until the
  # backend is VM-proven; default off must never read as rollback
  # support. Requires the /@snapshots layout from fresh installs.
  snapshots:
    title: System snapshots (Btrfs)
    packages: [snapper, snap-pac, grub-btrfs, inotify-tools]
    services: [snapper-timeline.timer, snapper-cleanup.timer, grub-btrfsd.service]
    appliesTo: [desktop, studio, gaming]
    defaultByEdition: {desktop: false, server: false, agents: false, studio: false, gaming: false}
    conflicts: []
    requires: []
  developer:
    title: Developer profile
    packages: [base-devel, git, gdb, strace]
    services: []
    appliesTo: [desktop, server, agents, studio, gaming]
    defaultByEdition: {desktop: false, server: false, agents: false, studio: false, gaming: false}
    conflicts: []
    requires: []
# Provenance for every kernel, bootloader, and capability package above,
# in the same auditable shape as studioProvenance/gamingProvenance.
installationProvenance:
  linux: {source: arch-core, sourceUrl: "https://archlinux.org/packages/core/x86_64/linux/", licenses: [GPL-2.0-only], licenseClass: open-source, installMethod: pacman-repository, optional: false, support: supported}
  linux-headers: {source: arch-core, sourceUrl: "https://archlinux.org/packages/core/x86_64/linux-headers/", licenses: [GPL-2.0-only], licenseClass: open-source, installMethod: pacman-repository, optional: false, support: supported}
