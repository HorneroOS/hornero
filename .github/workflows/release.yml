---
# horneroctl release: on horneroctl-v* tags, create the GitHub Release,
# build native per-arch binaries with the pinned V toolchain, upload
# them as release assets, then publish horneroctl-bin to AUR with the
# real checksums. Mirrors the agent-toolkit release pattern (matrix +
# arch gate + smoke test), scoped to the two Linux arches AUR serves.

name: release

on:
  push:
    tags:
      - "horneroctl-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify release tag points to main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor \
            "${RELEASE_SHA}" refs/remotes/origin/main; then
            echo "Refusing to release a commit that is not on main." >&2
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          generate_release_notes: true
          # Keep assets private until both architectures are signed and
          # verified. The publish job runs only after the build matrix passes.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  build:
    name: Build ${{ matrix.asset }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: horneroctl-linux-x86_64
            expect_arch: x86_64
          - os: ubuntu-24.04-arm
            asset: horneroctl-linux-arm64
            expect_arch: arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # Build V from the shared lock; this also avoids architecture-specific
      # prebuilt compiler assets on the arm64 runner.
      - name: Install pinned V
        uses: ./.github/actions/setup-v
      - name: Verify toolchain
        run: v version
      - name: Check architecture
        run: |
          got="$(uname -m | tr 'A-Z' 'a-z')"
          case "${got}" in
            aarch64|arm64) got=arm64 ;;
            x86_64|amd64) got=x86_64 ;;
          esac
          want="${{ matrix.expect_arch }}"
          if [ "${got}" != "${want}" ]; then
            echo "mismatch: ${got} != ${want}" >&2
            exit 1
          fi
      # Release provenance: bake the candidate composition (the manifest
      # manifests/candidate names at the tagged commit) into `horneroctl
      # version`, exactly as scripts/compose.sh does for composed builds.
      - name: Export composition pins
        run: |
          pip install --quiet pyyaml
          manifest="manifests/$(grep -v '^#' manifests/candidate | grep -v '^$' | head -1)"
          python3 - "$manifest" >> "$GITHUB_ENV" <<'PY'
          import sys, yaml
          from pathlib import Path
          m = yaml.safe_load(open(sys.argv[1]))
          rel = Path("releases") / (Path(sys.argv[1]).stem + ".yaml")
          version = yaml.safe_load(open(rel)).get("version", "unknown") if rel.is_file() else "unknown"
          print(f"HX_SHELL_SHA={m['components']['shell']['sha']}")
          print(f"HX_CONFIG_SHA={m['components']['config']['sha']}")
          print(f"HX_MANIFEST={m['name']}")
          print(f"HX_RELEASE={version}")
          PY
      - name: Build native CLI
        working-directory: cli
        run: ./make.vsh build-cli
      - name: Smoke test
        working-directory: cli
        run: |
          ./build/horneroctl version
          # A release binary must name its tag (never -dirty) and its pins.
          if ./build/horneroctl version | grep -q -- '-dirty'; then
            echo "release build is dirty" >&2
            exit 1
          fi
          ./build/horneroctl version --json > /tmp/hx-version.json
          python3 - <<'PY'
          import json, os
          d = json.load(open("/tmp/hx-version.json"))["data"]
          assert d["shell_sha"] == os.environ["HX_SHELL_SHA"], d
          assert d["config_sha"] == os.environ["HX_CONFIG_SHA"], d
          assert d["manifest"] == os.environ["HX_MANIFEST"], d
          PY
          ./build/horneroctl --help | head -n 12
          cp -f build/horneroctl "build/${{ matrix.asset }}"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "cli/build/${{ matrix.asset }}" --clobber
      - name: Sign release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.HORNERO_RELEASE_GPG_PRIVATE_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.HORNERO_RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY}" ]; then
            echo "HORNERO_RELEASE_GPG_PRIVATE_KEY is required; refusing an unsigned release." >&2
            exit 1
          fi
          pubkey="packaging/keys/hornero-release.pub.asc"
          if [ ! -s "${pubkey}" ]; then
            echo "Committed release public key is missing: ${pubkey}" >&2
            exit 1
          fi
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "${GNUPGHOME}" && chmod 700 "${GNUPGHOME}"
          printf '%s' "${SIGNING_KEY}" | gpg --batch --quiet --import
          public_fingerprints="$(gpg --batch --with-colons --show-keys "${pubkey}" \
            | awk -F: '$1 == "pub" { want=1; next } want && $1 == "fpr" { print $10; want=0 }')"
          secret_fingerprints="$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "sec" { want=1; next } want && $1 == "fpr" { print $10; want=0 }')"
          key_id=""
          while IFS= read -r candidate; do
            if printf '%s\n' "${public_fingerprints}" | grep -Fxq "${candidate}"; then
              key_id="${candidate}"
              break
            fi
          done <<< "${secret_fingerprints}"
          if [ -z "${key_id}" ]; then
            echo "No private key in the release secret matches the committed public key." >&2
            exit 1
          fi
          asset="cli/build/${{ matrix.asset }}"
          HORNERO_RELEASE_KEY_ID="${key_id}" \
            HORNERO_RELEASE_PASSPHRASE="${SIGNING_PASSPHRASE}" \
            scripts/sign-release.sh "${asset}"
          scripts/verify-release.sh "${asset}"
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "${asset}.asc" --clobber

  publish-release:
    name: Publish verified release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft after every asset verifies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.create-release.outputs.tag }}" --draft=false

  aur-publish:
    name: Publish horneroctl-bin to AUR
    needs: [create-release, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify release commit is on main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor \
            "${RELEASE_SHA}" refs/remotes/origin/main; then
            echo "Refusing to publish an AUR package from a commit outside main." >&2
            exit 1
          fi
      - name: Stamp pkgver and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          tag: ${{ needs.create-release.outputs.tag }}
        run: |
          pkgdir="${GITHUB_WORKSPACE}/packaging/horneroctl-bin"
          pkgbuild="${pkgdir}/PKGBUILD"
          mkdir -p /tmp/assets
          gh release download "${tag}" -D /tmp/assets \
            -p 'horneroctl-linux-x86_64' -p 'horneroctl-linux-x86_64.asc' \
            -p 'horneroctl-linux-arm64' -p 'horneroctl-linux-arm64.asc'
          scripts/stamp-aur-package.sh "${tag}" /tmp/assets "${pkgbuild}"
          grep -E '^(pkgver|source_|sha256sums_)' "${pkgbuild}"
      - name: Publish AUR package
        uses: ulises-jeremias/github-actions-aur-publish@507f0dba7755bdc2ad351232405bd7e4cd4a4a67  # v1
        with:
          pkgname: horneroctl-bin
          pkgbuild: packaging/horneroctl-bin/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Release ${{ needs.create-release.outputs.tag }}
