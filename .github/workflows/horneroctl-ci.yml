name: horneroctl-ci

on:
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/horneroctl-ci.yml']
  # No paths filter on PRs: required contexts must always report, otherwise
  # strict branch protection blocks the merge forever (see Track 1).
  pull_request:

jobs:
  horneroctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # The shared lock avoids upstream master changes breaking unrelated PRs.
      - name: Install pinned V
        uses: ./.github/actions/setup-v
      - name: Verify toolchain
        run: v version
      - name: Install Minisign for community registry tests
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Format check
        working-directory: cli
        run: ./make.vsh fmt-check
      # Non-blocking vet+test: the pinned toolchain has upstream memory
      # bugs (`v vet` corrupts its own diagnostics — vlang/v#28692; `v test`
      # reporter faults on large suites, confirmed 2026-09-18 — vlang/v#28693).
      # Re-enforce when those issues close; fmt/build still gate. Full test
      # gating stays on the pinned weekly toolchain until then.
      - name: Vet
        working-directory: cli
        continue-on-error: true
        run: ./make.vsh vet
      - name: Test
        working-directory: cli
        continue-on-error: true
        run: ./make.vsh test
      # The pinned V test target is non-blocking while upstream reporter
      # faults remain, so keep the security-critical signature integration
      # independently blocking after installing Minisign above.
      - name: Community registry signature integration
        working-directory: cli
        run: v test modules/hornero_core/community_registry_test.v
      - name: Build
        working-directory: cli
        run: ./make.vsh build-cli && ./build/horneroctl version && ./build/horneroctl config paths

  signing-smoke:
    name: Release signing smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # Ephemeral-key tamper test for hornero#180: clean asset
      # verifies, tampered asset is rejected. The real release key
      # is a human custody step (docs/RELEASE_SIGNING.md).
      - name: Signing smoke test
        run: bash scripts/test-signing.sh
