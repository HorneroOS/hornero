name: horneroctl-ci

on:
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/horneroctl-ci.yml']
  # No paths filter on PRs: required contexts must always report, otherwise
  # strict branch protection blocks the merge forever (see Track 1).
  pull_request:

jobs:
  horneroctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # The shared lock avoids upstream master changes breaking unrelated PRs.
      - name: Install pinned V
        uses: ./.github/actions/setup-v
      - name: Verify toolchain
        run: v version
      - name: Format check
        working-directory: cli
        run: ./make.vsh fmt-check
      # Non-blocking vet+test: the pinned toolchain has upstream memory
      # bugs (`v vet` corrupts its own diagnostics — vlang/v#28692; `v test`
      # reporter faults on large suites, confirmed 2026-09-18 — vlang/v#28693).
      # Re-enforce when those issues close; fmt/build still gate. Full test
      # gating stays on the pinned weekly toolchain until then.
      - name: Vet
        working-directory: cli
        continue-on-error: true
        run: ./make.vsh vet
      - name: Test
        working-directory: cli
        continue-on-error: true
        run: ./make.vsh test
      - name: Build
        working-directory: cli
        run: ./make.vsh build-cli && ./build/horneroctl version && ./build/horneroctl config paths
