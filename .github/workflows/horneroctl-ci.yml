name: horneroctl-ci

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/horneroctl-ci.yml']
  # No paths filter on PRs: required contexts must always report, otherwise
  # strict branch protection blocks the merge forever (see Track 1).
  pull_request:

jobs:
  horneroctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # The shared lock avoids upstream master changes breaking unrelated PRs.
      - name: Install pinned V
        uses: ./.github/actions/setup-v
      - name: Verify toolchain
        run: v version
      - name: Install Minisign for community registry tests
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Format check
        working-directory: cli
        run: ./make.vsh fmt-check
      # Non-blocking vet: the pinned toolchain has an upstream memory bug
      # (`v vet` corrupts its own diagnostics — vlang/v#28692).
      - name: Vet
        working-directory: cli
        continue-on-error: true
        run: ./make.vsh vet
      - name: Test
        working-directory: cli
        env:
          VJOBS: "2"
        run: ./make.vsh test
      - name: Community registry signature integration
        working-directory: cli
        run: v test modules/hornero_core/community_registry_test.v
      - name: Build (dev + prod)
        working-directory: cli
        run: |
          ./make.vsh build-cli --prod
          ./out/horneroctl version
          ./out/horneroctl config paths

  build-arm64:
    name: Build arm64 (-prod)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install pinned V
        uses: ./.github/actions/setup-v
      - name: Verify toolchain
        run: v version
      - name: Build native arm64 CLI (-prod)
        working-directory: cli
        run: |
          ./make.vsh build-cli --prod
          ./out/horneroctl version
          ./out/horneroctl config paths

  signing-smoke:
    name: Release signing smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # Ephemeral-key tamper test for hornero#180: clean asset
      # verifies, tampered asset is rejected. The real release key
      # is a human custody step (docs/RELEASE_SIGNING.md).
      - name: Signing smoke test
        run: bash scripts/test-signing.sh

  aur-gpg-regression:
    name: AUR GPG fresh-install regression
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      # persist-credentials: false — the regression script sources the
      # AUR PKGBUILD, so no GitHub token may remain in the workspace.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # AUR end-user regression: a fresh keyring with an unreachable
      # keyserver must still build the published horneroctl-bin by
      # importing the shipped keys/pgp key; missing/unrelated keys and
      # tampered downloads must fail. Tests the AUR snapshot users get.
      - name: AUR GPG fresh-install regression
        run: |
          # makepkg refuses to run as root; the container starts as root.
          # Clone the AUR git tree instead of the snapshot tarball: the
          # tarball is CDN-cached and can lag the published PKGBUILD.
          useradd -m builder
          pacman -Sy --noconfirm git >/dev/null
          git clone --depth 1 https://aur.archlinux.org/horneroctl-bin.git \
            /tmp/aur-snapshot/horneroctl-bin
          chown -R builder:builder /tmp/aur-snapshot
          runuser -u builder -- \
            bash scripts/test-aur-gpg.sh /tmp/aur-snapshot/horneroctl-bin
