name: horneroctl-ci

on:
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/horneroctl-ci.yml']
  # No paths filter on PRs: required contexts must always report, otherwise
  # strict branch protection blocks the merge forever (see Track 1).
  pull_request:

jobs:
  horneroctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # Always latest V: build master HEAD from source. Plain
      # `git clone --depth 1 + make` bootstraps fine with the runner's cc
      # (verified 2026-09-17); no version pin exists on purpose — pins rot.
      - name: Install V (master HEAD)
        run: |
          git clone -q --depth 1 https://github.com/vlang/v /tmp/vlang-src
          make -C /tmp/vlang-src
          echo "/tmp/vlang-src" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: v version
      - name: Format check
        working-directory: cli
        run: ./make.vsh fmt-check
      - name: Vet
        working-directory: cli
        run: ./make.vsh vet
      - name: Test
        working-directory: cli
        run: ./make.vsh test
      - name: Build
        working-directory: cli
        run: ./make.vsh build-cli && ./build/horneroctl version && ./build/horneroctl config paths
