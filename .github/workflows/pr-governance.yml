# Thin caller for the shared HorneroOS PR-governance engine.
#
# The engine lives in HorneroOS/.github (`governance/danger`) and is
# versioned by `governance-*` tags: callers pin a full commit SHA with a
# version comment (currently governance-v1).
#
# Fork-safe: triggers on `pull_request` (never `pull_request_target`
# combined with checkout + execution of PR code). Least privilege below.

name: PR governance

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  governance:
    uses: HorneroOS/.github/.github/workflows/pr-governance.yml@91b24509dfa043d5ca9e63d3ce2248a4c401c6b5 # governance-v1.1
    with:
      engine-ref: 91b24509dfa043d5ca9e63d3ce2248a4c401c6b5 # governance-v1.1
    permissions:
      contents: read
      pull-requests: write
