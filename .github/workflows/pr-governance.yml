# Thin caller for the shared HorneroOS PR-governance engine.
#
# The engine lives in HorneroOS/.github (`governance/danger`) and is
# versioned by `governance-*` tags: callers pin a full commit SHA with a
# version comment (currently governance-v1.3).
#
# Fork-safe: triggers on `pull_request` (never `pull_request_target`
# combined with checkout + execution of PR code). Least privilege below.

name: PR governance

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  governance:
    uses: HorneroOS/.github/.github/workflows/pr-governance.yml@ce0dfa83591969920d14e4cd57a01ccf615a25fc # governance-v1.3
    with:
      engine-ref: ce0dfa83591969920d14e4cd57a01ccf615a25fc # governance-v1.3
    permissions:
      contents: read
      pull-requests: write
