---
# Thin caller for the shared HorneroOS PR-governance engine.
#
# The engine lives in HorneroOS/.github (`governance/danger`) and is
# versioned by `governance-*` tags: callers pin a full commit SHA with a
# version comment (currently governance-v1.5).
#
# Fork-safe: triggers on `pull_request` (never `pull_request_target`
# combined with checkout + execution of PR code). Least privilege below.

name: PR governance

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  governance:
    # yamllint disable rule:line-length
    uses: HorneroOS/.github/.github/workflows/pr-governance.yml@23c634b3c5587dc336fb11dfaee4f6ad0779e300  # governance-v1.5
    # yamllint enable rule:line-length
    with:
      # Same engine pin as `uses:` above.
      engine-ref: 23c634b3c5587dc336fb11dfaee4f6ad0779e300
    permissions:
      contents: read
      pull-requests: write
