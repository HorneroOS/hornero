name: composition-ci

on:
  push:
    branches: [main]
    paths:
      - 'manifests/**'
      - 'profiles/**'
      - 'releases/**'
      - 'scripts/**'
      - 'tests/**'
      - 'cli/**'
      - 'docs/**'
      - '.github/workflows/composition-ci.yml'
  # No paths filter on PRs: required contexts must always report, otherwise
  # strict branch protection blocks the merge forever (see Track 1).
  pull_request:

jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install checker dependencies
        run: pip install pyyaml jsonschema pytest
      - name: Validate composition
        run: python3 scripts/check-manifests.py
      - name: Run composition tests
        run: python3 -m pytest tests/ -q
      - name: Lint composition docs
        run: npx --yes markdownlint-cli manifests/README.md profiles/README.md releases/v0.1.0-draft-checklist.md releases/v0.2.0-preview2-checklist.md docs/*.md
  pin-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install checker dependencies
        run: pip install pyyaml
      - name: Verify manifest pins match live main SHAs
        run: python3 scripts/check-pins.py
  secrets-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Scan for committed secrets
        run: bash scripts/secrets-lint.sh
  compose:
    runs-on: ubuntu-latest
    env:
      VJOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install compose dependencies
        run: pip install pyyaml
      # Same master-HEAD toolchain as horneroctl-ci (see that workflow).
      - name: Install V (master HEAD)
        run: |
          git clone -q --depth 1 https://github.com/vlang/v /tmp/vlang-src
          make -C /tmp/vlang-src
          echo "/tmp/vlang-src" >> "$GITHUB_PATH"
      - name: Resolve current Shell and Config main commits
        id: pins
        run: |
          shell_sha="$(git ls-remote https://github.com/HorneroOS/shell refs/heads/main | cut -f1)"
          config_sha="$(git ls-remote https://github.com/HorneroOS/config refs/heads/main | cut -f1)"
          [[ "$shell_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$config_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "shell_sha=$shell_sha"
            echo "config_sha=$config_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Build current-main composition and validate it
        env:
          SHELL_SHA: ${{ steps.pins.outputs.shell_sha }}
          CONFIG_SHA: ${{ steps.pins.outputs.config_sha }}
        run: |
          manifest="manifests/mainline-ci.yaml"
          trap 'rm -f "$manifest"' EXIT
          cat > "$manifest" <<EOF
          apiVersion: hornero.os/v1
          kind: CompositionManifest
          name: hornero-mainline-ci
          components:
            shell:
              repo: https://github.com/HorneroOS/shell
              sha: $SHELL_SHA
              status: pinned
            config:
              repo: https://github.com/HorneroOS/config
              sha: $CONFIG_SHA
              status: pinned
          EOF
          ./scripts/compose.sh --manifest "$manifest" --work "${{ runner.temp }}/hx-compose" --yes
