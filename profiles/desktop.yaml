# Hornero OS edition profile: desktop

apiVersion: hornero.os/v1
kind: EditionProfile
name: desktop
manifest: hornero-0.2.0-preview23
description: >-
  Full desktop edition for daily use on hardware. Extends base with
  the complete desktop defaults; same pinned components.
target: hardware
extends: base
components:
  - name: shell
    role: Desktop shell UX as pinned by the manifest.
  - name: config
    role: Full desktop defaults (themes, hypr, applications) as pinned by the manifest.
  - name: horneroctl
    role: System CLI built from this repository.
notes: >-
  Desktop is a Preview edition: it installs from the signed Preview
  ISO (VM-validated, not Supported).
