# Hornero OS edition profile: studio

apiVersion: hornero.os/v1
kind: EditionProfile
name: studio
manifest: hornero-0.2.0-preview21
description: >-
  Creative-workstation release profile. Extends desktop with the same
  pinned components; Studio package composition, specializations, and
  application selection live only in editions/catalogue.yaml.
target: hardware
extends: desktop
components:
  - name: shell
    role: Desktop shell UX as pinned by the manifest.
  - name: config
    role: Full desktop defaults as pinned by the manifest.
  - name: horneroctl
    role: System CLI built from this repository.
notes: >-
  Studio remains planned: this profile records release composition only.
  It is not installable or imageable yet, and it duplicates no package
  lists, workloads, or application selection from the edition catalogue.
